{% extends 'base.html' %}

{% block title %}Connexion — QA Recipe Converter{% endblock %}

{% block content %}
<section class="card" style="max-width:440px;margin:0 auto 1.5rem;padding:1.5rem;">
    <h1 style="margin-bottom:1rem;">Connexion</h1>
    <form method="post">
        {% csrf_token %}
        <p style="margin-bottom:1rem;"><label>Nom d'utilisateur ou e-mail<br><input type="text" name="username" required autocomplete="username" style="width:100%;min-height:44px;padding:.6rem;border:1px solid var(--slate-300);border-radius:var(--radius);"></label></p>
        <p style="margin-bottom:1rem;"><label>Mot de passe<br><input type="password" name="password" required autocomplete="current-password" style="width:100%;min-height:44px;padding:.6rem;border:1px solid var(--slate-300);border-radius:var(--radius);"></label></p>
        <button class="btn btn-primary" type="submit">Se connecter</button>
        <a href="{% url 'web-register' %}" style="margin-left:1rem;">Créer un compte</a>
    </form>
</section>
{% endblock %}
